[package]
name = "drawing-workbench"
version = "0.1.0"
description = "Drawing Workbench (hello-world proof of concept)"
edition = "2021"

[lib]
name = "drawing_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
