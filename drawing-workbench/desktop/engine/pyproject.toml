[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-desktop"
version = "0.1.0"
description = "Drawing Workbench desktop sidecar: thin FastAPI adapter over workbench_core"
requires-python = ">=3.11"
dependencies = [
  "workbench-core",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
build = ["nuitka>=2.4", "zstandard>=0.22", "ordered-set>=4.1"]

[project.scripts]
workbench-engine = "workbench_desktop.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["workbench_desktop*"]
